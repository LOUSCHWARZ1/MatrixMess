<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://www.tiktok.com https://www.instagram.com">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MatrixMess</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="spaces.css">
<link rel="stylesheet" href="media.css">
<link rel="stylesheet" href="embeds.css">
<link rel="stylesheet" href="emoji.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>

  <!-- ===== Login ===== -->
  <div id="login-screen" class="screen hidden">
    <div class="login-card">
      <div class="login-icon" aria-hidden="true"></div>
      <h1>MatrixMess</h1>
      <p class="login-sub">Melde dich mit deinem Matrix-Konto an</p>
      <form id="login-form" autocomplete="on">
        <label class="field">
          <span>Homeserver</span>
          <input id="login-hs" type="text" value="https://matrix.org" autocomplete="url" spellcheck="false">
        </label>
        <label class="field">
          <span>Benutzername</span>
          <input id="login-user" type="text" placeholder="benutzer oder @benutzer:server" autocomplete="username" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Passwort</span>
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <div id="login-error" class="login-error hidden" role="alert"></div>
        <button id="login-btn" class="primary-btn" type="submit">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div id="app" class="hidden">

    <aside id="sidebar">
      <header class="sidebar-header">
        <div class="app-badge" aria-hidden="true"></div>
        <h2>MatrixMess</h2>
        <button id="calendar-btn" class="icon-btn" title="Kalender" aria-label="Kalender öffnen"><span id="calendar-badge" class="hidden"></span></button>
        <button id="settings-btn" class="icon-btn" title="Einstellungen" aria-label="Einstellungen"></button>
        <button id="sidebar-toggle" class="icon-btn" title="Seitenleiste einklappen" aria-label="Seitenleiste umschalten" aria-expanded="true"></button>
      </header>
      <div class="search-wrap">
        <input id="room-search" type="search" placeholder="Suchen" aria-label="Räume durchsuchen">
      </div>
      <div id="space-bar" aria-label="Bereiche"></div>
      <nav id="room-list" aria-label="Raumliste"></nav>
    </aside>

    <main id="chat">
      <div id="chat-empty" class="chat-empty">
        <div class="chat-empty-icon" aria-hidden="true"></div>
        <p>Wähle einen Raum aus, um loszulegen</p>
      </div>

      <div id="chat-view" class="hidden">
        <header id="chat-header">
          <button id="back-btn" class="icon-btn" title="Zurück" aria-label="Zurück zur Raumliste"></button>
          <div id="chat-avatar" class="avatar" aria-hidden="true"></div>
          <div class="chat-title">
            <div id="chat-name"></div>
            <div id="chat-sub"></div>
          </div>
          <button id="event-btn" class="header-pill-btn" title="Termin planen" aria-label="Termin planen"><span>Termin</span></button>
        </header>

        <div id="timeline-wrap">
          <div id="timeline" tabindex="0"></div>
          <button id="scroll-down-btn" class="hidden" title="Nach unten" aria-label="Nach unten scrollen">
            <span id="scroll-down-count" class="hidden"></span>
          </button>
        </div>

        <div id="typing-bar" class="hidden">
          <span id="typing-text"></span>
          <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <div id="composer-banner" class="hidden">
          <div class="banner-stripe" aria-hidden="true"></div>
          <div class="banner-info">
            <div id="banner-title"></div>
            <div id="banner-body"></div>
          </div>
          <button id="banner-cancel" class="icon-btn" title="Abbrechen" aria-label="Abbrechen"></button>
        </div>

        <footer id="composer">
          <button id="attach-btn" class="icon-btn composer-btn" title="Datei anhängen" aria-label="Datei anhängen"></button>
          <input id="file-input" type="file" multiple class="hidden" tabindex="-1" aria-hidden="true">
          <textarea id="composer-input" rows="1" placeholder="Nachricht" aria-label="Nachricht schreiben"></textarea>
          <button id="emoji-btn" class="icon-btn composer-btn" title="Emoji einfügen" aria-label="Emoji einfügen"></button>
          <button id="mic-btn" class="icon-btn composer-btn" title="Sprachnachricht aufnehmen" aria-label="Sprachnachricht aufnehmen"></button>
          <button id="send-btn" title="Senden" aria-label="Nachricht senden" disabled></button>
        </footer>
      </div>
    </main>
  </div>

  <!-- ===== Einstellungen ===== -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <h3 id="settings-title">Einstellungen</h3>
        <button id="settings-close" class="icon-btn" title="Schließen" aria-label="Einstellungen schließen"></button>
      </header>

      <section class="settings-section">
        <h4>Erscheinungsbild</h4>
        <div id="theme-seg" class="segmented" role="radiogroup" aria-label="Theme">
          <button data-theme-opt="system" role="radio">System</button>
          <button data-theme-opt="light" role="radio">Hell</button>
          <button data-theme-opt="dark" role="radio">Dunkel</button>
        </div>
        <h4>Akzentfarbe</h4>
        <div id="accent-row" aria-label="Akzentfarbe"></div>
        <h4>Chat-Dichte</h4>
        <div id="density-seg" class="segmented" role="radiogroup" aria-label="Chat-Dichte">
          <button data-density-opt="comfortable" role="radio">Komfortabel</button>
          <button data-density-opt="compact" role="radio">Kompakt</button>
        </div>
        <h4>Textgröße</h4>
        <div id="textsize-seg" class="segmented" role="radiogroup" aria-label="Textgröße">
          <button data-textsize-opt="small" role="radio">Klein</button>
          <button data-textsize-opt="standard" role="radio">Standard</button>
          <button data-textsize-opt="large" role="radio">Groß</button>
          <button data-textsize-opt="xlarge" role="radio">Sehr groß</button>
        </div>
      </section>

      <section class="settings-section">
        <h4>Chat</h4>
        <label class="toggle-row">
          <span>Link-Vorschauen</span>
          <input id="linkpreview-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
        <label class="toggle-row">
          <span>Medien inline anzeigen</span>
          <input id="inlinemedia-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
        <label class="toggle-row">
          <span>Mit Enter senden</span>
          <input id="entersend-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
      </section>

      <section class="settings-section">
        <h4>Privatsphäre</h4>
        <label class="toggle-row">
          <span>Lesebestätigungen senden</span>
          <input id="readreceipt-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
        <label class="toggle-row">
          <span>Tippindikatoren senden</span>
          <input id="typing-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
      </section>

      <section class="settings-section">
        <h4>Benachrichtigungen</h4>
        <label class="toggle-row">
          <span>Desktop-Benachrichtigungen</span>
          <input id="notif-toggle" type="checkbox">
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
      </section>

      <section class="settings-section">
        <h4>Verschlüsselung</h4>
        <div id="crypto-status" class="settings-user"></div>
        <button id="recovery-btn" class="primary-btn" type="button">Recovery Key eingeben</button>
        <form id="recovery-form" class="hidden">
          <label class="field">
            <span>Recovery Key (Base64)</span>
            <input id="recovery-input" type="password" autocomplete="off" spellcheck="false">
          </label>
          <button id="recovery-submit" class="primary-btn" type="submit">Schlüssel importieren</button>
        </form>
      </section>

      <section class="settings-section">
        <h4>Konto</h4>
        <div id="settings-user" class="settings-user"></div>
        <button id="logout-btn" class="danger-btn">Abmelden</button>
        <div class="settings-version">MatrixMess Web · Version 0.5.0</div>
      </section>
    </div>
  </div>

  <div id="emoji-popover" class="hidden" role="menu" aria-label="Schnellreaktionen"></div>
  <div id="toast-container" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
