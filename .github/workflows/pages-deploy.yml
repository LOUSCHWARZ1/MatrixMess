name: Deploy Website

on:
  push:
    # Produktions-Deploy NUR vom Release-/Arbeitsbranch: ein Push auf einen
    # beliebigen anderen Feature-/Experimentier-Branch, der site/** oder
    # clients/web/** berührt, darf nicht die Live-Seite und /app-PWA
    # überschreiben. (Aktueller Deploy-Branch dieses Projekts.)
    branches: [claude/gifted-sagan-kradma]
    paths:
      - "site/**"
      - "clients/web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p public
          cp -r site/. public/
          mkdir -p public/app
          cp -r clients/web/. public/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
