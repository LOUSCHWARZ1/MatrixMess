name: Unit Tests

on:
  push:
    branches: ["**"]
    paths:
      - "clients/web/**"
      - "tests/**"
      - "package.json"
      - "vitest.config.js"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "clients/web/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
