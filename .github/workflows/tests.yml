name: Unit Tests

on:
  push:
    branches: ["**"]
    paths:
      - "clients/web/**"
      - "tests/**"
      - "package.json"
      - "vitest.config.js"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "clients/web/**"
      - "tests/**"

# Least privilege: Tests brauchen nur Lesezugriff.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
