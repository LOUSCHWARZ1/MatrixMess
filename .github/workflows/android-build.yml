name: Android Build

on:
  push:
    paths:
      - "clients/web/**"
      - "clients/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

# Least privilege: dieser Build braucht nur Lesezugriff auf den Code; der
# Artefakt-Upload benötigt keine Schreibrechte am GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.7"

      - name: Copy web assets into APK
        run: |
          mkdir -p clients/android/app/src/main/assets/web
          cp -r clients/web/. clients/android/app/src/main/assets/web/

      - name: Build release APK
        env:
          # Signing-Material kommt ausschliesslich aus GitHub-Actions-Secrets,
          # nie aus dem Repo. Fehlen die Secrets, wird unsigniert gebaut.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd clients/android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            export ANDROID_KEYSTORE_FILE="release.keystore"
            echo "Release-Keystore aus Secret dekodiert – signierter Build."
          else
            echo "::warning::Keine Android-Signing-Secrets gesetzt – unsignierter Release-Build."
          fi
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MatrixMess-Android-APK
          path: clients/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
