name: Desktop Windows Build

on:
  push:
    paths:
      - "clients/web/**"
      - "clients/desktop/**"
      - ".github/workflows/desktop-windows-build.yml"
  workflow_dispatch:

# Least privilege: nur Lesezugriff auf den Code nötig.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Copy web assets into desktop wrapper
        shell: bash
        run: cp -r clients/web clients/desktop/web

      - name: Install dependencies and build
        shell: bash
        run: |
          cd clients/desktop
          npm ci --no-audit --no-fund
          npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MatrixMess-Windows-Setup
          path: clients/desktop/dist/*.exe
          if-no-files-found: error
